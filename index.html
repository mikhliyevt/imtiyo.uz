<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/user_6af5c2387f063b9da1195d31/d8d26fc43_image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Imtiyo — O‘zbekiston talabalari uchun chegirmalar platformasi. EVOS, Oqtepa Lavash, Safia, 1Fit va boshqa brendlardan talabalik chegirmalari."
    />
    <meta name="theme-color" content="#002D96" />
    <title>Imtiyo — Talabalar uchun chegirmalar</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('imtiyo_theme_mode_v1');
          var isDark =
            saved === 'dark' ||
            (saved === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
